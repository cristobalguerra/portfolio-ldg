<style>
:root{
  --paper:#F1ECDF; --paper-2:#E7E1D0; --ink:#1B1612; --ink-soft:#5C564A;
  --yellow:#FFE000; --verm:#B23818; --ok:#2F6B3A;
  --line:rgba(27,22,18,.16); --line-2:rgba(27,22,18,.34);
  --disp:"Anton","Arial Narrow",sans-serif;
  --sans:"Atkinson Hyperlegible",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,monospace;
  --t-mono:.72rem; --ease:cubic-bezier(.22,1,.36,1); --gut:clamp(16px,4.5vw,56px);
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;z-index:0;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:56px 56px}
body>*{position:relative;z-index:1}
::selection{background:var(--yellow);color:var(--ink)}
:focus-visible{outline:2px solid var(--verm);outline-offset:2px}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:var(--mono);font-size:var(--t-mono);letter-spacing:.08em;text-transform:uppercase}
.soft{color:var(--ink-soft)}
.disp{font-family:var(--disp);font-weight:400;text-transform:uppercase;line-height:.98;letter-spacing:.01em}
.hl{background:linear-gradient(var(--yellow),var(--yellow)) no-repeat 0 62%/100% .84em}

/* topline */
.topline{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px var(--gut);border-bottom:2px solid var(--ink);background:var(--paper)}
.topline .brand{font-family:var(--disp);font-size:1.15rem;text-decoration:none;display:flex;align-items:center;gap:8px}
.topline .chip{background:var(--yellow);font-family:var(--mono);font-size:var(--t-mono);font-weight:700;padding:2px 7px;letter-spacing:.1em}
.topline .doc{display:none}
@media(min-width:760px){.topline .doc{display:block}}
.btn{background:var(--ink);color:var(--paper);border:2px solid var(--ink);padding:10px 18px;font-family:var(--mono);font-size:var(--t-mono);font-weight:700;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;transition:background .2s var(--ease),color .2s var(--ease)}
.btn:hover{background:var(--yellow);color:var(--ink)}
.btn.line{background:transparent;color:var(--ink)}
.btn.line:hover{background:var(--ink);color:var(--paper)}
.btn.sm{padding:6px 10px;border-width:1px}
.btn[disabled]{opacity:.45;cursor:wait}

/* login */
#login{max-width:440px;margin:9vh auto 0;padding:0 var(--gut) 60px}
#login h1{font-size:clamp(2.6rem,10vw,4.4rem);margin:10px 0 14px}
#login p{color:var(--ink-soft);margin-bottom:28px;max-width:40ch}
.field{margin-bottom:20px}
.field label{display:block;margin-bottom:6px;color:var(--ink-soft)}
.field input,.in{width:100%;background:var(--paper);border:1px solid var(--line-2);padding:11px 12px;border-radius:0}
.field input:focus-visible,.in:focus-visible{outline:2px solid var(--verm);outline-offset:0}
#loginMsg{margin-top:16px;min-height:22px;color:var(--verm)}

/* app */
#app{display:none}
.tabs{display:flex;gap:0;overflow-x:auto;border-bottom:2px solid var(--ink);padding:0 var(--gut);background:var(--paper);position:sticky;top:0;z-index:5;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{background:none;border:0;padding:14px 14px 12px;cursor:pointer;white-space:nowrap;color:var(--ink-soft);border-bottom:4px solid transparent;margin-bottom:-2px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--yellow);font-weight:700}
.tabs .n{color:var(--verm);font-weight:700}
main{padding:clamp(22px,4vw,44px) var(--gut) 80px;max-width:1500px;margin:0 auto}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px 24px;margin-bottom:22px}
.head h1{font-size:clamp(2rem,6vw,3.3rem)}
.head p{color:var(--ink-soft);max-width:60ch;margin-top:8px}
.seg{display:inline-flex;border:2px solid var(--ink)}
.seg button{background:none;border:0;padding:8px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
select.in{width:auto;padding:8px 10px}

/* malla */
.malla{display:grid;gap:22px}
@media(min-width:1000px){.malla{grid-auto-flow:column;grid-auto-columns:minmax(190px,1fr);overflow-x:auto;gap:12px;padding-bottom:10px;align-items:start}}
.sem h2{font-size:1.5rem;border-top:2px solid var(--ink);padding-top:8px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:baseline}
.sem h2 small{font-family:var(--mono);font-size:var(--t-mono);color:var(--ink-soft);letter-spacing:.08em}
.cell{display:block;width:100%;text-align:left;background:var(--paper);border:1px solid var(--line-2);padding:10px 11px;margin-bottom:8px;cursor:pointer;transition:background .2s var(--ease),border-color .2s var(--ease)}
.cell:hover{background:var(--paper-2);border-color:var(--ink)}
.cell .cl{display:flex;justify-content:space-between;gap:8px;color:var(--ink-soft)}
.cell .nm{display:block;font-weight:700;line-height:1.25;margin:4px 0 6px}
.cell .ft{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.cell .tag{white-space:normal}
.cell{min-width:0;overflow-wrap:anywhere}
.cell.estudio{border-left:5px solid var(--ink)}
.tag{font-family:var(--mono);font-size:var(--t-mono);letter-spacing:.04em;padding:1px 6px;border:1px solid var(--line-2);white-space:nowrap}
.tag.y{background:var(--yellow);border-color:var(--yellow)}
.tag.v{color:var(--verm);border-color:var(--verm)}
.tag.ok{color:var(--ok);border-color:var(--ok)}
.tag.k{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;margin:0 0 18px;color:var(--ink-soft)}

/* tablas y listas */
.tbl-scroll{overflow-x:auto;border-top:2px solid var(--ink)}
table{width:100%;border-collapse:collapse;min-width:720px}
th{text-align:left;padding:10px 12px 10px 0;border-bottom:1px solid var(--line-2);color:var(--ink-soft);white-space:nowrap}
td{padding:11px 12px 11px 0;border-bottom:1px solid var(--line);vertical-align:top;font-size:.95rem}
.lk{background:none;border:0;padding:0;cursor:pointer;text-align:left;font-weight:700;text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:3px}
.lk:hover{text-decoration-color:var(--verm)}
.ac{border-top:2px solid var(--ink);padding:16px 0 22px;display:grid;gap:12px}
@media(min-width:900px){.ac{grid-template-columns:minmax(220px,1fr) 2fr;gap:28px}}
.ac h2{font-size:1.7rem}
.ac .who{margin-top:8px}
.ac .who div{margin-bottom:4px}
.bar{display:flex;height:10px;border:1px solid var(--ink);margin:10px 0 4px;max-width:260px}
.bar i{display:block;height:100%}
.bar .d{background:var(--ink)} .bar .p{background:var(--yellow)} .bar .s{background:var(--verm)}
.pairs{display:grid;gap:6px}
.pair{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:start;padding:7px 0;border-bottom:1px solid var(--line)}
.pair .arrow{font-family:var(--mono);color:var(--ink-soft);padding-top:2px}
.empty{border:1px dashed var(--line-2);padding:22px;color:var(--ink-soft);max-width:70ch}
.alert-g{border-top:2px solid var(--ink);padding:14px 0 20px}
.alert-g h2{font-size:1.35rem;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.alert-g p.d{color:var(--ink-soft);margin:4px 0 10px;max-width:70ch}
.alert-g ul{list-style:none;display:grid;gap:6px}
.alert-g li{padding:8px 10px;border:1px solid var(--line-2);display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;justify-content:space-between}
details.more summary{cursor:pointer;padding:6px 0;color:var(--ink-soft)}

/* ficha */
dialog{border:2px solid var(--ink);background:var(--paper);color:var(--ink);padding:0;width:min(860px,100vw);max-width:100vw;max-height:100dvh;margin:auto}
@media(max-width:700px){dialog{width:100vw;height:100dvh;max-height:100dvh;border-width:0}}
dialog::backdrop{background:rgba(27,22,18,.55)}
.fx{position:sticky;top:0;background:var(--paper);border-bottom:2px solid var(--ink);padding:12px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px;z-index:2}
.fb{padding:18px 18px 40px}
.fb h2{font-size:clamp(1.7rem,5vw,2.4rem);margin-bottom:14px}
.caj{display:grid;grid-template-columns:repeat(2,1fr);border-top:2px solid var(--ink);border-left:1px solid var(--line-2);margin-bottom:20px}
@media(min-width:640px){.caj{grid-template-columns:repeat(4,1fr)}}
.caj div{border-right:1px solid var(--line-2);border-bottom:1px solid var(--line-2);padding:8px 10px;min-width:0}
.caj .k{display:block;color:var(--ink-soft)}
.caj .v{display:block;font-weight:700;overflow-wrap:anywhere}
.sec{margin-top:22px}
.sec h3{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.sec h3 .no{background:var(--yellow);padding:1px 7px;font-weight:700}
.sec p,.sec li{max-width:72ch}
.sec ol,.sec ul{padding-left:20px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chipx{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--ink);padding:3px 8px;font-size:.92rem;background:var(--paper)}
.chipx button{background:none;border:0;cursor:pointer;color:var(--verm);font-weight:700;padding:0 2px}
.chipx.miss{border-color:var(--verm);color:var(--verm)}
.addrow{display:flex;gap:8px;flex-wrap:wrap}
.addrow .in{flex:1 1 220px}
.two{display:grid;gap:18px}
@media(min-width:700px){.two{grid-template-columns:1fr 1fr}}
.adm{border:1px dashed var(--line-2);padding:14px;margin-top:26px;display:grid;gap:12px}
.adm label{display:grid;gap:4px;min-width:0}
.adm>*{min-width:0}
.adm select.in{width:100%;max-width:100%}
textarea.in{min-height:96px;resize:vertical}
.cels{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:8px 0 16px}
.cel{border:1px solid var(--line-2);background:var(--paper);padding:10px;display:grid;gap:8px;align-content:start;min-width:0}
.cel.lead{grid-column:1/-1;grid-template-columns:96px 1fr;gap:14px;border:2px solid var(--ink);align-items:start}
@media(min-width:640px){.cel.lead{grid-column:span 2}}
.cel .nm{font-weight:700;line-height:1.2;overflow-wrap:anywhere}
.cel .ct{display:grid;gap:2px;font-size:.9rem;overflow-wrap:anywhere}
.cel .ct a{text-underline-offset:3px}
.av{width:56px;height:56px;object-fit:cover;background:var(--paper-2);border:1px solid var(--ink);display:inline-grid;place-items:center;font-family:var(--disp);font-size:1.2rem;flex:none}
.av.big{width:96px;height:96px;font-size:2rem}
.av.sm{width:26px;height:26px;font-size:.72rem}
.avs{display:inline-flex;gap:3px;vertical-align:middle}
.files{list-style:none!important;padding:0!important;display:grid;gap:6px;margin-bottom:12px}
.files li{border:1px solid var(--line-2);padding:8px 10px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;justify-content:space-between;max-width:none}
.files .meta{display:block;color:var(--ink-soft);font-size:.85rem}
.up{display:grid;gap:8px;border:1px dashed var(--line-2);padding:12px}
@media(min-width:640px){.up{grid-template-columns:1fr 2fr}}
.up .full{grid-column:1/-1}
#form .fb{display:grid;gap:14px}
#form label{display:grid;gap:4px}
.checks{display:grid;gap:6px;max-height:220px;overflow:auto;border:1px solid var(--line-2);padding:10px}
.checks label{display:flex!important;gap:8px;align-items:center}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;z-index:50;opacity:0;pointer-events:none;transition:opacity .25s var(--ease)}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="topline">
  <a class="brand" href="index.html">LDG <span class="chip">UDEM</span></a>
  <span class="mono soft doc">DOC · MESA DE ACADEMIAS · USO INTERNO</span>
  <span id="sesion" class="mono soft"></span>
</header>

<section id="login">
  <span class="mono soft">Lámina interna · Acceso restringido</span>
  <h1 class="disp">Mesa de <span class="hl">Academias</span></h1>
  <p>Planes, materias, academias, entregables, perfil del alumno y candados de LDG 2021 y LDVN 2027. Entra con tu cuenta del sitio.</p>
  <div class="field"><label class="mono" for="admEmail">Correo</label><input id="admEmail" type="email" autocomplete="username"></div>
  <div class="field"><label class="mono" for="admPass">Contraseña</label><input id="admPass" type="password" autocomplete="current-password"></div>
  <button class="btn" id="admEntrar">Entrar</button>
  <p id="loginMsg" role="status"></p>
</section>

<section id="app">
  <nav class="tabs mono" role="tablist" aria-label="Vistas">
    <button role="tab" data-v="malla">Malla</button>
    <button role="tab" data-v="academias">Academias</button>
    <button role="tab" data-v="personas">Directorio</button>
    <button role="tab" data-v="equiv">Equivalencias</button>
    <button role="tab" data-v="alumno">Alumno</button>
    <button role="tab" data-v="alertas">Alertas <span class="n" id="nAlertas"></span></button>
    <button role="tab" data-v="datos">Datos</button>
  </nav>
  <main id="vista" tabindex="-1"></main>
</section>

<dialog id="ficha" aria-labelledby="fichaT"></dialog>
<dialog id="form" aria-labelledby="formT"></dialog>
<div class="toast mono" id="toast" role="status"></div>

<script>
(function(){
'use strict';
var $=function(s,r){return (r||document).querySelector(s);};
var ESC={'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return ESC[c];});}
function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim();}
function slug(s){return norm(s).replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,60);}
function keys(o){return Object.keys(o||{});}
function toast(t){var el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(function(){el.classList.remove('on');},2600);}
function fail(err){toast('No se guardó ('+((err&&err.code)||'error')+')');}

var D={materias:{},academias:{},equivalencias:{},candados:{},perfiles:{},habilidades:{},personas:{},archivos:{},meta:null};
var F={}; /* fotos por persona, nodo aparte para no cargar la escucha principal */
var CATS=['Syllabus','Entregable','Rúbrica','Otro'];
var EXT=/\.(pdf|docx?|pptx?|xlsx?|png|jpe?g)$/i, MAXB=4*1024*1024;
var S={vista:'malla',plan:'LDVN',tipo:'',sem:2,esAdmin:false,uid:null,abierta:null};
var PLAN={LDG:'LDG 2021',LDVN:'LDVN 2027'};

/* ---------- lectura de datos ---------- */
function mats(plan){
  return keys(D.materias).map(function(k){return D.materias[k];}).filter(function(m){return !plan||m.plan===plan;})
    .sort(function(a,b){return (a.semestre||99)-(b.semestre||99)||(b.creditos||0)-(a.creditos||0)||a.nombre.localeCompare(b.nombre);});
}
function M(k){return D.materias[k];}
function acad(id){var a=D.academias[id];return a?a.num+' '+a.nombre:'';}
function perfil(k){var p=D.perfiles[k]||{};return {entrada:keys(p.entrada),salida:keys(p.salida)};}
function hab(s){return D.habilidades[s]||s;}
function candadosDe(k){return keys(D.candados).map(function(id){var c=D.candados[id];c._id=id;return c;}).filter(function(c){return c.materia===k;});}
function proveedores(m,h){
  if(!m.semestre) return [];
  return mats(m.plan).filter(function(p){return p.semestre&&p.semestre<m.semestre&&perfil(p.clave).salida.indexOf(h)!==-1;});
}
function P(id){return D.personas[id];}
function ini(n){return String(n||'?').trim().split(/\s+/).slice(0,2).map(function(x){return x.charAt(0);}).join('').toUpperCase();}
function av(pid,cls){
  var p=P(pid)||{}, f=F[pid];
  return (typeof f==='string'&&f.indexOf('data:image/')===0)?'<img class="av '+(cls||'')+'" src="'+esc(f)+'" alt="Foto de '+esc(p.nombre)+'">':'<span class="av '+(cls||'')+'" aria-hidden="true">'+esc(ini(p.nombre))+'</span>';
}
function liderNombre(a){return a?((P(a.liderId)||{}).nombre||a.lider||''):'';}
function apoyoIds(a){return keys(a&&a.apoyoIds).filter(P);}
function apoyoNombre(a){if(!a)return '';var n=apoyoIds(a).map(function(x){return P(x).nombre;});return n.length?n.join(', '):(a.apoyo||'');}
function profes(k){return keys((M(k)||{}).profesores).filter(P);}
function archivos(k){var o=D.archivos[k]||{};return keys(o).map(function(id){var f=o[id];f._id=id;return f;}).sort(function(a,b){return CATS.indexOf(a.categoria)-CATS.indexOf(b.categoria)||String(a.titulo).localeCompare(String(b.titulo));});}
function rolesDe(pid){
  var r=[];
  keys(D.academias).forEach(function(id){var a=D.academias[id];if(a.liderId===pid)r.push('Líder · '+a.nombre);else if((a.apoyoIds||{})[pid])r.push('Apoyo · '+a.nombre);});
  return r;
}
function materiasDe(pid){return mats().filter(function(m){return (m.profesores||{})[pid];});}
function cel(pid,rol,o){
  var p=P(pid); if(!p) return ''; o=o||{};
  var ct='';
  if(p.correo) ct+='<a href="mailto:'+esc(p.correo)+'">'+esc(p.correo)+'</a>';
  if(p.telefono) ct+='<a href="tel:'+esc(String(p.telefono).replace(/[^0-9+]/g,''))+'">'+esc(p.telefono)+'</a>';
  if(p.ubicacion) ct+='<span class="soft">'+esc(p.ubicacion)+'</span>';
  return '<article class="cel'+(o.lead?' lead':'')+'">'+av(pid,o.lead?'big':'')+'<div style="display:grid;gap:6px;min-width:0"><span class="mono soft">'+esc(rol)+'</span><div class="nm">'+esc(p.nombre)+'</div>'
    +(p.puesto?'<div class="soft" style="font-size:.9rem">'+esc(p.puesto)+'</div>':'')+(ct?'<div class="ct">'+ct+'</div>':(o.lead?'<div class="soft" style="font-size:.9rem">Sin datos de contacto</div>':''))
    +(o.extra||'')+'<div><button class="btn line sm" data-edit-p="'+esc(pid)+'">Editar</button></div></div></article>';
}
function esEstudio(m){return (m.creditos===12)||/^estudio\b/i.test(m.nombre);}

/* ---------- alertas ---------- */
function alertas(){
  var A={hueco:[],sugerido:[],sobrante:[],sinPerfil:[],sinEntregable:[],sinAcademia:[],sinSemestre:[],sinEquiv:[],nueva:[],repetido:[],sinProfesor:[],sinSyllabus:[],sinLider:[]};
  var sug={};
  mats().forEach(function(m){
    var p=perfil(m.clave);
    if(!p.entrada.length||!p.salida.length) A.sinPerfil.push({k:m.clave,t:(!p.entrada.length&&!p.salida.length)?'Sin perfil de entrada ni de salida':(!p.entrada.length?'Falta perfil de entrada':'Falta perfil de salida')});
    if(!(m.entregables||[]).length) A.sinEntregable.push({k:m.clave});
    if(!m.academia) A.sinAcademia.push({k:m.clave});
    if(!m.semestre) A.sinSemestre.push({k:m.clave});
    if(!profes(m.clave).length) A.sinProfesor.push({k:m.clave});
    if(!archivos(m.clave).some(function(f){return f.categoria==='Syllabus';})) A.sinSyllabus.push({k:m.clave});
    p.entrada.forEach(function(h){
      if(!m.semestre) return;
      var pr=proveedores(m,h);
      if(!pr.length){ if(m.semestre>1) A.hueco.push({k:m.clave,t:hab(h)}); return; }
      var ultimo=pr[pr.length-1];
      var hay=candadosDe(m.clave).some(function(c){return c.requiere===ultimo.clave;});
      if(!hay){var id=m.clave+'|'+ultimo.clave;(sug[id]=sug[id]||{k:m.clave,req:ultimo.clave,h:[]}).h.push(hab(h));}
    });
    candadosDe(m.clave).forEach(function(c){
      var pe=perfil(m.clave).entrada, ps=perfil(c.requiere).salida;
      if(pe.length&&ps.length&&!pe.some(function(h){return ps.indexOf(h)!==-1;})) A.sobrante.push({k:m.clave,req:c.requiere,tipo:c.tipo});
    });
  });
  A.sugerido=keys(sug).map(function(id){return sug[id];});
  keys(D.equivalencias).forEach(function(k){if(D.equivalencias[k].tipo==='Sin equivalencia') A.sinEquiv.push({k:k});});
  var dest={};keys(D.equivalencias).forEach(function(k){var d=D.equivalencias[k].destino;if(d)dest[d]=1;});
  mats('LDVN').forEach(function(m){if(!dest[m.clave]) A.nueva.push({k:m.clave});});
  ['LDG','LDVN'].forEach(function(pl){
    var seen={};
    mats(pl).forEach(function(m){(m.entregables||[]).forEach(function(e){
      if(!m.semestre) return; var id=m.semestre+'|'+norm(e);
      if(seen[id]&&seen[id]!==m.clave) A.repetido.push({k:m.clave,req:seen[id],t:e}); else seen[id]=m.clave;
    });});
  });
  return A;
}

 ['sugerido','Candado sugerido','Una materia depende del perfil de salida de otra y no hay candado entre ellas. Es recomendación interna: la malla oficial de LDVN solo declara seriación en PEF II.'],
 ['sobrante','Candado sin sustento','Hay candado y ninguna habilidad compartida lo justifica.'],
 ['repetido','Entregable repetido','Dos materias del mismo semestre piden el mismo entregable.'],
 ['sinAcademia','Materia sin academia','Materias que todavía no pertenecen a ninguna academia.'],
 ['sinSemestre','Materia sin semestre','Falta ubicar la materia en la malla.'],
 ['sinEquiv','Sin equivalencia en LDVN','Materias 2021 cuyo contenido no cubre ninguna obligatoria LDVN.'],
 ['nueva','LDVN sin antecedente','Materias LDVN que ninguna materia 2021 cargada acredita. Prácticas y PEF aparecen aquí porque falta su plan analítico 2021.'],
 ['sinProfesor','Materia sin profesor','Materias sin profesores asignados.'],
 ['sinSyllabus','Sin syllabus','Materias sin syllabus cargado.'],

];

function fotoCuadrada(file){
  return new Promise(function(ok,no){
    var img=new Image(), u=URL.createObjectURL(file);
    img.onload=function(){
      var n=Math.min(img.width,img.height), c=document.createElement('canvas'); c.width=c.height=480;
      c.getContext('2d').drawImage(img,(img.width-n)/2,(img.height-n)/2,n,n,0,0,480,480);
      URL.revokeObjectURL(u); ok(c.toDataURL('image/jpeg',.82));
    };
    img.onerror=function(){URL.revokeObjectURL(u);no(new Error('imagen'));};
    img.src=u;
  });
}

function subirArchivo(){
  var k=S.abierta, f=$('#uFile').files[0], url=$('#uUrl').value.trim(), cat=$('#uCat').value, tit=$('#uTit').value.trim();
  if(!f&&!url){toast('Elige un archivo o pega una liga');return;}
  if(!f&&!/^https:\/\//.test(url)){toast('La liga debe empezar con https://');return;}
  if(f&&!EXT.test(f.name)){toast('Tipo de archivo no permitido');return;}
  if(f&&f.size>MAXB){toast('El archivo pesa más de 4 MB: usa una liga de Drive');return;}
  var user=firebase.auth().currentUser, id=db.ref('plataforma/archivos/'+k).push().key;
  var meta={categoria:cat,titulo:(tit||(f?f.name:cat)).slice(0,200),por:(user&&user.email)||'',fecha:(function(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);})(new Date())};
  var btn=$('#uSubir'); btn.disabled=true;
  var listo=function(){toast('Archivo guardado');};
  var mal=function(e){btn.disabled=false;fail(e);};
  if(!f){meta.url=url.slice(0,1000);db.ref('plataforma/archivos/'+k+'/'+id).set(meta).then(listo).catch(mal);return;}
  meta.nombre=f.name.slice(0,200);meta.tamano=f.size;

  r.onload=function(){db.ref('plataformaArchivos/'+id).set(r.result).then(function(){return db.ref('plataforma/archivos/'+k+'/'+id).set(meta);}).then(listo).catch(mal);};

  r.readAsDataURL(f);

  var enc=['Clave 2021','Materia LDG 2021','Academia 2025','Clave LDVN','Materia LDVN 2027','Tipo','Unidades cubiertas','Relación','Evidencia','Pendiente'];
  var filas=mats('LDG').filter(function(m){return D.equivalencias[m.clave];}).map(function(m){var e=D.equivalencias[m.clave],d=M(e.destino);
    return [m.clave,m.nombre,acad(m.academia),e.destino,d?d.nombre:'',e.tipo,e.cubiertas+' de '+e.total,e.relacion,e.evidencia,e.pendiente].map(c).join(',');});
  descargar('equivalencias-ldg2021-ldvn2027.csv','﻿'+enc.join(',')+'\n'+filas.join('\n'),'text/csv;charset=utf-8');
}
function cargarSemilla(){
  var f=$('#semilla').files[0]; if(!f){toast('Elige el archivo primero');return;}
  var r=new FileReader();
  r.onload=function(){
    var j; try{j=JSON.parse(r.result);}catch(e){toast('El archivo no es JSON válido');return;}
    if(!j||!j.materias||!j.academias||!j.equivalencias){toast('El archivo no tiene el formato esperado');return;}
    if(!confirm('Se van a reemplazar '+keys(j.materias).length+' materias, '+keys(j.academias).length+' academias y '+keys(j.equivalencias).length+' equivalencias. ¿Continuar?')) return;
    keys(j.materias).forEach(function(k){var act=D.materias[k];if(act&&act.profesores)j.materias[k].profesores=act.profesores;});
    keys(j.academias).forEach(function(k){var act=D.academias[k];if(act&&(act.liderId||act.apoyoIds)){j.academias[k].liderId=act.liderId||null;j.academias[k].apoyoIds=act.apoyoIds||null;j.academias[k].lider=act.lider||'';j.academias[k].apoyo=act.apoyo||'';}});
    var pers={};keys(j.personas).forEach(function(k){pers[k]=D.personas[k]||j.personas[k];});keys(D.personas).forEach(function(k){pers[k]=D.personas[k];});
    db.ref('plataforma').update({materias:j.materias,academias:j.academias,equivalencias:j.equivalencias,candados:j.candados||{},personas:pers,meta:j.meta||{generado:new Date().toISOString().slice(0,10)}})
      .then(function(){toast('Datos cargados');}).catch(fail);
  };
  r.readAsText(f);
}

/* ---------- sesión ---------- */
function mostrar(user){
  S.uid=user.uid;
  $('#login').style.display='none';$('#app').style.display='block';
  $('#sesion').innerHTML=esc(user.email||'')+' · <button class="btn line sm" id="salirBtn">Salir</button>';
  $('#salirBtn').addEventListener('click',function(){salir('Sesión cerrada.');});
  db.ref('admins/'+user.uid).once('value').then(function(s){S.esAdmin=s.val()===true;pintar();}).catch(function(){S.esAdmin=false;});
  db.ref('plataformaFotos').on('value',function(s){F=s.val()||{};pintar();},function(){});
  db.ref('plataforma').on('value',function(snap){
    var v=snap.val()||{};
    ['materias','academias','equivalencias','candados','perfiles','habilidades','personas','archivos'].forEach(function(k){D[k]=v[k]||{};});
    D.meta=v.meta||null; pintar();
  },function(err){salir('Tu cuenta no tiene acceso a la plataforma ('+((err&&err.code)||'error')+'). Pide a dirección de programa que te agregue.');});
}
function salir(msg){
  db.ref('plataforma').off();db.ref('plataformaFotos').off();F={};firebase.auth().signOut();
  $('#app').style.display='none';$('#login').style.display='block';$('#sesion').textContent='';$('#loginMsg').textContent=msg||'';
  if($('#ficha').open)$('#ficha').close();
  if($('#form').open)$('#form').close();
}
$('#admEntrar').addEventListener('click',function(){
  var btn=this;btn.disabled=true;$('#loginMsg').textContent='Entrando…';
  firebase.auth().signInWithEmailAndPassword($('#admEmail').value.trim(),$('#admPass').value)
    .then(function(){btn.disabled=false;$('#loginMsg').textContent='';})
    .catch(function(){btn.disabled=false;$('#loginMsg').textContent='No se pudo entrar: revisa correo y contraseña.';});
});
$('#admPass').addEventListener('keydown',function(e){if(e.key==='Enter')$('#admEntrar').click();});
if(typeof firebase==='undefined'){$('#loginMsg').textContent='No se pudo cargar Firebase. Revisa tu conexión.';}
else firebase.auth().onAuthStateChanged(function(user){
  if(user&&!user.isAnonymous){if($('#app').style.display!=='block')mostrar(user);}
});
})();
</script>
